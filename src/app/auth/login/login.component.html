<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <div class="header-actions">
        <button mat-icon-button routerLink="/landing" class="home-btn">
          <mat-icon>home</mat-icon>
        </button>
      </div>
      <mat-card-title class="text-center">
        <h2>Welcome Back</h2>
      </mat-card-title>
      <mat-card-subtitle class="text-center">
        Sign in to your TutorConnect Pro account
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput [(ngModel)]="email" name="email" type="email" required>
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [(ngModel)]="password" name="password" type="password" required>
          <mat-icon matSuffix>lock</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Role</mat-label>
          <mat-select [(ngModel)]="role" name="role">
            <mat-option value="student">Student</mat-option>
            <mat-option value="tutor">Tutor</mat-option>
          </mat-select>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="full-width">
          Sign In
        </button>
      </form>

      <div class="resend-section">
        <button mat-stroked-button (click)="resendVerification()" class="full-width">
          Resend verification email
        </button>
      </div>
      
      <div class="register-link">
        <p>Don't have an account? <a routerLink="/register">Create one here</a></p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
